name: Collect feed

# Facebook throttles by source IP: after roughly eight page requests from one
# address it stops refusing and starts answering HTTP 200 with a ~430KB shell
# that has no posts in it, where a real page is ~950KB-1MB. One job asking for
# twenty-seven pages therefore only ever got the first few.
#
# Every GitHub-hosted job is a fresh VM, so the fix is to stop asking from one
# address. Nine parallel shards ask for three pages each - well under the
# threshold, with room for the browser pass on every source - and a merge job
# folds the results into feed.json. Only the merge job writes feed.json; nine
# jobs committing the same file would lose posts.

on:
  workflow_dispatch:
  # The heartbeat workflow is what actually drives the cadence - GitHub's cron
  # has never fired for this repo. This stays as a backup in case it starts.
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "collect.py"
      - "index.html"

concurrency:
  group: collect-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard being blocked must not cancel the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v7

      # The whole design rests on these jobs not sharing an address.
      # Print it so the run itself proves or disproves that, rather than us
      # assuming it.
      - name: Show this runner's public IP
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org || echo "unknown")
          echo "shard ${{ matrix.shard }} is calling from $ip"
          echo "- shard ${{ matrix.shard }}: \`$ip\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide whether a browser is needed
        id: caps
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("sources.json"))
          fb = any(s.get("enabled", True) and s.get("platform", "").lower() == "facebook"
                   for s in cfg.get("sources", []))
          cookies = bool(os.environ.get("X_COOKIES") or os.environ.get("FB_COOKIES"))
          need = fb or cookies
          # Only key=value may go into GITHUB_OUTPUT; anything else fails the step.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"browser={'true' if need else 'false'}\n")
          print(f"facebook sources: {fb}, cookie secrets: {cookies}, browser: {need}")
          PY

      - name: Install the Playwright package
        if: steps.caps.outputs.browser == 'true'
        id: pw
        run: |
          pip install playwright
          v=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "playwright $v"

      - name: Cache Playwright browser
        if: steps.caps.outputs.browser == 'true'
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version. The old fixed key meant that once a
          # cache existed it was never rewritten, so a Playwright upgrade
          # re-downloaded Chromium on every run forever.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        if: steps.caps.outputs.browser == 'true'
        run: |
          set -u

          # Playwright's dependency installer shells out to `apt-get update`,
          # which reads EVERY repo configured on the runner image - including
          # Google's Chrome repo, which this workflow does not use. On
          # 2026-09-09 that repo served a Packages.gz whose hash did not match
          # its own Release file, apt exited 100, and all nine shards died
          # before they ever reached Facebook. Nothing we install comes from a
          # third-party repo, so take them out of the picture.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true

          # The browser binary comes from Playwright's own CDN, not from apt.
          # This is the part that genuinely has to work.
          python -m playwright install chromium

          # System libraries are a best-effort top-up: ubuntu-latest already
          # ships what Chromium needs, because it ships Chrome. If apt is having
          # a bad day, warn and carry on - collect.py tries each route per
          # source, so a missing deep read costs some posts, not the whole run.
          if python -m playwright install-deps chromium; then
            echo "browser dependencies installed"
          else
            echo "::warning::apt could not install browser dependencies - continuing with the libraries already on the image"
          fi

          # Say plainly whether the browser actually launches, so the log answers
          # that question instead of leaving it to be guessed from missing posts.
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          try:
              with sync_playwright() as pw:
                  b = pw.chromium.launch()
                  print("chromium launches OK:", b.version)
                  b.close()
          except Exception as exc:
              print(f"::warning::chromium will not launch ({type(exc).__name__}: {exc}) "
                    "- this run will be quick-read only")
          PY

      - name: Collect this shard
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          python collect.py --verbose \
            --shard ${{ matrix.shard }} --shards 9 \
            --out "part-${{ matrix.shard }}.json"

      - name: Hand the catch to the merge job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: part-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  merge:
    needs: shard
    # Merge whatever came back. Waiting for all nine to succeed would throw
    # away eight good shards because one was blocked.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Since v8 a checksum mismatch on a downloaded artifact fails the step
      # instead of just warning. That is the right default - a corrupt shard
      # result should not be merged into the feed - but if this step ever fails
      # with a digest error, that is what it means, and the fix is to re-run
      # rather than to loosen the check.
      - name: Collect the shard results
        uses: actions/download-artifact@v8
        with:
          path: parts
          pattern: part-*
          merge-multiple: true

      - name: Merge into the feed
        run: python collect.py --verbose --merge parts

      - name: Commit updated feed
        run: |
          set -u
          git config user.name  "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # feed.json is a generated file, so rebasing this run's version onto
          # another run's conflicts every single time - and a conflicted
          # feed.json carries git markers, which makes it invalid JSON. That is
          # what broke the run where two collections landed 49 seconds apart.
          #
          # So do not rebase it. If the push is rejected, discard our copy,
          # take the one that actually landed, and fold this run's shard
          # results into THAT. merge() dedups by post id, so redoing it is
          # safe and neither run's posts are lost.
          for attempt in 1 2 3; do
            git add feed.json media
            if git diff --staged --quiet; then
              echo "No new posts - nothing to commit."
              exit 0
            fi
            git commit -q -m "Update feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected - another run landed first, re-merging onto it"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset --hard -q "origin/${GITHUB_REF_NAME}"
            # parts/ is untracked artifact data, so it survives the reset.
            # --no-retry: this is a re-merge, not a reason to hit Facebook again.
            python collect.py --verbose --merge parts --no-retry
          done
          echo "could not push after 3 attempts - the next run will pick this up"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Feed status"
            echo ""
            if [ -f feed.json ]; then
              python - <<'PY'
          import json
          # Never let the summary be the thing that fails the run - if the feed
          # is unreadable, say so here and let the real error stand out.
          try:
              d = json.load(open("feed.json"))
          except Exception as exc:
              print(f"feed.json could not be read: {type(exc).__name__}: {exc}")
              raise SystemExit(0)
          print(f"**{d.get('count', 0)} posts** · generated {d.get('generated','?')}")
          print()
          print("| Source | Status | Route / error |")
          print("|---|---|---|")
          for s in d.get("sources", []):
              mark = "ok" if s.get("ok") else ("embed only" if s.get("embed_only") else "FAILED")
              detail = s.get("route") or (s.get("error","")[:160] or "-")
              print(f"| {s.get('platform')}/{s.get('handle')} | {mark} | {detail} |")
          PY
            else
              echo "No feed.json was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
