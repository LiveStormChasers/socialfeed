name: Collect feed

# Facebook throttles by source IP: after roughly eight page requests from one
# address it stops refusing and starts answering HTTP 200 with a ~430KB shell
# that has no posts in it, where a real page is ~950KB-1MB. One job asking for
# nineteen pages therefore only ever got the first few.
#
# Every GitHub-hosted job is a fresh VM, so the fix is to stop asking from one
# address. Five parallel shards ask for about four pages each - under the
# threshold - and a merge job folds the results into feed.json. Only the merge
# job writes feed.json; five jobs committing the same file would lose posts.

on:
  workflow_dispatch:
  # The heartbeat workflow is what actually drives the cadence - GitHub's cron
  # has never fired for this repo. This stays as a backup in case it starts.
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "collect.py"
      - "index.html"

concurrency:
  group: collect-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard being blocked must not cancel the other four.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      # The whole design rests on these five jobs not sharing an address.
      # Print it so the run itself proves or disproves that, rather than us
      # assuming it.
      - name: Show this runner's public IP
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org || echo "unknown")
          echo "shard ${{ matrix.shard }} is calling from $ip"
          echo "- shard ${{ matrix.shard }}: \`$ip\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide whether a browser is needed
        id: caps
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("sources.json"))
          fb = any(s.get("enabled", True) and s.get("platform", "").lower() == "facebook"
                   for s in cfg.get("sources", []))
          cookies = bool(os.environ.get("X_COOKIES") or os.environ.get("FB_COOKIES"))
          need = fb or cookies
          # Only key=value may go into GITHUB_OUTPUT; anything else fails the step.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"browser={'true' if need else 'false'}\n")
          print(f"facebook sources: {fb}, cookie secrets: {cookies}, browser: {need}")
          PY

      - name: Cache Playwright browser
        if: steps.caps.outputs.browser == 'true'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Install Chromium
        if: steps.caps.outputs.browser == 'true'
        run: |
          pip install playwright
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Collect this shard
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          python collect.py --verbose \
            --shard ${{ matrix.shard }} --shards 5 \
            --out "part-${{ matrix.shard }}.json"

      - name: Hand the catch to the merge job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  merge:
    needs: shard
    # Merge whatever came back. Waiting for all five to succeed would throw
    # away four good shards because one was blocked.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect the shard results
        uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
          merge-multiple: true

      - name: Merge into the feed
        run: python collect.py --verbose --merge parts

      - name: Commit updated feed
        run: |
          git config user.name  "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json media
          if git diff --staged --quiet; then
            echo "No new posts - nothing to commit."
          else
            git commit -m "Update feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
              sleep 5
            done
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Feed status"
            echo ""
            if [ -f feed.json ]; then
              python - <<'PY'
          import json
          d = json.load(open("feed.json"))
          print(f"**{d.get('count', 0)} posts** · generated {d.get('generated','?')}")
          print()
          print("| Source | Status | Route / error |")
          print("|---|---|---|")
          for s in d.get("sources", []):
              mark = "ok" if s.get("ok") else ("embed only" if s.get("embed_only") else "FAILED")
              detail = s.get("route") or (s.get("error","")[:160] or "-")
              print(f"| {s.get('platform')}/{s.get('handle')} | {mark} | {detail} |")
          PY
            else
              echo "No feed.json was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
