name: Collect feed

on:
  schedule:
    # Every 5 minutes — the shortest interval GitHub accepts. Free and unlimited
    # because this repo is public. GitHub queues cron on shared infrastructure
    # and deprioritises it under load, so the real interval is usually longer;
    # treat this as "as fast as GitHub will go", not a guarantee.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "sources.json"      # re-collect immediately when you add an account
      - "collect.py"
      - "index.html"

# Only one collection at a time, so two runs never race on the same commit.
concurrency:
  group: collect-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium is needed for the Facebook browser route and the optional X
      # cookie fallback. If neither applies, skip it entirely.
      - name: Decide whether a browser is needed
        id: caps
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("sources.json"))
          fb = any(s.get("enabled", True) and s.get("platform", "").lower() == "facebook"
                   for s in cfg.get("sources", []))
          cookies = bool(os.environ.get("X_COOKIES") or os.environ.get("FB_COOKIES"))
          need = fb or cookies
          # Only key=value may go into GITHUB_OUTPUT; anything else fails the step.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"browser={'true' if need else 'false'}\n")
          print(f"facebook sources: {fb}, cookie secrets: {cookies}, browser: {need}")
          PY

      # Restoring the browser from cache takes ~10s against ~60s to install it.
      # At a 5-minute cadence that is most of the per-run wall time.
      - name: Cache Playwright browser
        if: steps.caps.outputs.browser == 'true'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Install Chromium
        if: steps.caps.outputs.browser == 'true'
        run: |
          pip install playwright
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            # Browser binary is cached; still need the OS-level libraries.
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Collect
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: python collect.py --verbose

      - name: Commit updated feed
        run: |
          git config user.name  "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json media
          if git diff --staged --quiet; then
            echo "No new posts - nothing to commit."
          else
            git commit -m "Update feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # Another run may have landed while this one was collecting.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
              sleep 5
            done
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Feed status"
            echo ""
            if [ -f feed.json ]; then
              python - <<'PY'
          import json
          d = json.load(open("feed.json"))
          print(f"**{d.get('count', 0)} posts** · generated {d.get('generated','?')}")
          print()
          print("| Source | Status | Route / error |")
          print("|---|---|---|")
          for s in d.get("sources", []):
              mark = "ok" if s.get("ok") else ("embed only" if s.get("embed_only") else "FAILED")
              detail = s.get("route") or (s.get("error","")[:160] or "-")
              print(f"| {s.get('platform')}/{s.get('handle')} | {mark} | {detail} |")
          PY
            else
              echo "No feed.json was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
